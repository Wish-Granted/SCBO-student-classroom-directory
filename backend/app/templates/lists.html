<!-- templates/lists.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Lists</title>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/lists.js') }}"></script>

  <style>
    table {
    border-collapse: collapse;
    width: 98%;
    margin-left: 1%;
    margin-right: 1%;
    margin-top: 0.5em;
    border-radius: 3px;
  }

  th, td {
    border: 1px solid black;
    padding: 8px;
  }

  th {
    background-color: rgb(235, 235, 235);
  }
  </style>
</head>
<body>
  <a href="{{ url_for('main.index') }}">&larr; Back to search</a>

  <h1>Lists</h1>
  <button onclick="doGetLists()">Show all lists</button>
  <br><br>
  <input id="listNameBox" placeholder="New list name">
  <input id="listDescriptionBox" placeholder="New list description">
  <button onclick="doCreateList()">Create list</button>
  <br><br>
  <input id="openDeletelistIdBox" placeholder="List ID">
  <button onclick="doGetListDetail()">Open list</button>
  <button onclick="doDeleteList()">Delete list</button>
  <button onclick="doGetAllStudentInfo()">Get Student Info</button>
  <br><br>
  <input id="updateListIdBox" placeholder="List ID">
  <input id="updateListNameBox" placeholder="Updated list name">
  <input id="updateListDescriptionBox" placeholder="Updated list description">
  <button onclick="doUpdateListDetails()">Update list</button>
  <br><br>
  <input id="calledDeleteAddListIdBox" placeholder="List ID">
  <input id="calledDeleteAddStudentIdBox" placeholder="Student ID">
  <button onclick="doAddStudentToList()">Add to list</button>
  <button onclick="doRemoveStudentFromList()">Delete Student</button>
  <button onclick="doMarkCalled(true)">Mark called</button>
  <button onclick="doMarkCalled(false)">Unmark called</button>

  <div style="margin-top: 40px;">
    <div>
      <div style="display:flex; justify-content:space-between; padding-left: 1em; padding-right: 1em">
        <div>
          <span id="listTitle" style="font-size: 1.5em; font-weight: bold; display: block">No list loaded</span>
          <span id="listDescription" style="font-size: 1em; display: block">No list loaded</span>
        </div>
        <div>
          <label for="periodSelection">Select Period: </label>
          <select id="periodSelection" name="periodSelection">
            <option value="" disabled selected>N/A</option>
          </select>
          <button onclick="doGetAllStudentInfo(true)">Refresh</button>
        </div>
      </div>
      <table id="listTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Attendance</th>
            <th>Location</th>
            <th>Year Level</th>
            <th>Class Name</th>
            <th>Teacher</th>
            <th>Called</th>
            <th>Alternate Activities</th>
            <th>Class Code</th>
            <th>PC</th>
            <th>Student ID</th>
            <th>Added at</th>
            <th>Username</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
    
    <pre id="results"></pre>
  </div>
  <script>
    const periodSelection = document.getElementById("periodSelection");
    periodSelection.addEventListener('change', (event) => {
        const selectedValue = event.target.value;
        updateListTable(selectedValue)
    });
  </script>
</body>
</html>
