<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMinerva - Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container" style="max-width: 560px;">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">BMinerva</h1>
                <p>To use BMinerva in your browser, connect it to your eMinerva login:</p>
                <ol>
                    <li>Log in to
                        <a href="https://eminerva.bne.catholic.edu.au/eMinerva" target="_blank" rel="noopener">eMinerva</a>
                        in this browser (including 2FA).
                    </li>
                    <li>Click the <strong>BMinerva Connector</strong> extension icon, enter your username and press
                        <strong>Connect</strong>.</li>
                </ol>
            </div>
        </div>
    </div>
</body>
</html>
